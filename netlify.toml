[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "*.{js,css}"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

[[headers]]
  for = "manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
