<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="description" content="Finanzas Hogar - Control de finanzas familiares y negocios">
<title>Finanzas Hogar v2</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232c3e50' width='180' height='180'/><text x='90' y='90' font-size='90' fill='%23fff' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>FH</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div id="app-container">
<header class="app-header">
<div class="header-content">
<h1>💰 Finanzas Hogar</h1>
<div class="header-status">
<span id="firebase-status" class="status-dot offline" title="Estado Firebase"></span>
<span id="storage-status" class="status-dot online" title="Almacenamiento local"></span>
</div>
</div>
</header>

<nav class="app-nav">
<button class="nav-btn active" data-tab="dashboard">📊 Dashboard</button>
<button class="nav-btn" data-tab="ingresos">💵 Ingresos</button>
<button class="nav-btn" data-tab="gastos">💸 Gastos</button>
<button class="nav-btn" data-tab="flujos">🔄 Flujos</button>
<button class="nav-btn" data-tab="config">⚙️ Config</button>
</nav>

<main class="app-main">
<section id="dashboard" class="tab-content active">
<div id="dashboard-content"></div>
</section>

<section id="ingresos" class="tab-content">
<div id="ingresos-content"></div>
</section>

<section id="gastos" class="tab-content">
<div id="gastos-content"></div>
</section>

<section id="flujos" class="tab-content">
<div id="flujos-content"></div>
</section>

<section id="config" class="tab-content">
<div id="config-content"></div>
</section>
</main>

<footer class="app-footer">
<p>Finanzas Hogar v2 • Confecciones J&L + Tienda Lissette • Sincronización activa</p>
</footer>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/almacenamiento.js"></script>
<script src="js/modulos-ingresos.js"></script>
<script src="js/modulos-gastos.js"></script>
<script src="js/modulos-flujos.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>

<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('service-worker.js')
.then(reg => console.log('✅ Service Worker registrado'))
.catch(err => console.warn('⚠️ Service Worker error:', err));
}
</script>
</body>
</html>
