<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c3e50">
    <meta name="description" content="Control inteligente de finanzas familiares con flujos de caja separados">
    
    <title>Finanzas Inteligentes - Control de Flujos</title>
    
    <!-- Manifest para PWA -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232c3e50'/><text x='50%' y='50%' font-size='60' fill='white' text-anchor='middle' dy='0.3em'>💰</text></svg>">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <h1>💰 Finanzas Inteligentes</h1>
        </div>
        <ul class="navbar-menu">
            <li><button class="nav-btn active" data-tab="dashboard">📊 Dashboard</button></li>
            <li><button class="nav-btn" data-tab="ingresos">📈 Ingresos</button></li>
            <li><button class="nav-btn" data-tab="gastos">💳 Gastos</button></li>
            <li><button class="nav-btn" data-tab="flujos">🔄 Flujos</button></li>
            <li><button class="nav-btn" data-tab="config">⚙️ Config</button></li>
        </ul>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">
        
        <!-- TAB: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="section-header">
                <h2>📊 Dashboard Financiero</h2>
            </div>
            <div id="dashboard-content">Cargando...</div>
        </div>

        <!-- TAB: INGRESOS -->
        <div id="tab-ingresos" class="tab-content">
            <div class="section-header">
                <h2>📈 Registro de Ingresos</h2>
            </div>
            <div id="ingresos-content">Cargando...</div>
        </div>

        <!-- TAB: GASTOS -->
        <div id="tab-gastos" class="tab-content">
            <div class="section-header">
                <h2>💳 Registro de Gastos</h2>
            </div>
            <div id="gastos-content">Cargando...</div>
        </div>

        <!-- TAB: FLUJOS -->
        <div id="tab-flujos" class="tab-content">
            <div class="section-header">
                <h2>🔄 Flujos de Caja Duales</h2>
            </div>
            <div id="flujos-content">Cargando...</div>
        </div>

        <!-- TAB: CONFIGURACIÓN -->
        <div id="tab-config" class="tab-content">
            <div id="config-content">Cargando...</div>
        </div>

    </div>

    <!-- SCRIPTS -->
    
    <!-- Firebase SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>
    
    <!-- Scripts de la aplicación -->
    <script src="/js/firebase-config.js"></script>
    <script src="/js/almacenamiento.js"></script>
    <script src="/js/modulos-ingresos.js"></script>
    <script src="/js/modulos-gastos.js"></script>
    <script src="/js/modulos-flujos.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/app.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.warn('⚠️ Error registrando Service Worker:', err.message));
        }
    </script>
</body>
</html>
